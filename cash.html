<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GoodVidify — إتمام الشراء</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #090a0f; --gold-primary: #FFB800; --violet-neon: #7C3AED;
  --text-main: #ffffff; --text-muted: #a1a1aa;
}
body { margin: 0; background-color: var(--bg-dark); color: var(--text-main); font-family: 'Tajawal', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; perspective: 1200px; }
a { text-decoration: none; }

/* تأثيرات الخلفية */
.bg-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80vw; height: 80vw; background: radial-gradient(circle, rgba(124, 58, 237, 0.15) 0%, transparent 70%); z-index: -1; }

/* منصة العرض (الطاولة 3D) */
.checkout-pedestal { 
  width: 90%; max-width: 600px; 
  background: linear-gradient(180deg, rgba(30, 34, 48, 0.9), rgba(15, 17, 26, 0.9)); 
  border: 1px solid rgba(255, 255, 255, 0.1); 
  border-radius: 30px; padding: 50px 40px; 
  box-shadow: 0 40px 100px rgba(0,0,0,0.8), inset 0 2px 20px rgba(255,255,255,0.05);
  transform: rotateX(5deg) translateY(-10px);
  transition: 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  position: relative; z-index: 10;
  display: flex; flex-direction: column; align-items: center;
}
.checkout-pedestal:hover { transform: rotateX(0deg) translateY(0); box-shadow: 0 50px 120px rgba(124, 58, 237, 0.3); }

/* تفاصيل الباقة */
.plan-icon { font-size: 60px; margin-bottom: 10px; filter: drop-shadow(0 0 20px var(--gold-primary)); }
.plan-title { font-size: 32px; font-weight: 900; margin: 0 0 10px; text-align: center; }
.plan-price { font-size: 48px; font-weight: 900; color: var(--gold-primary); margin-bottom: 30px; font-family: 'Poppins', sans-serif; }
.plan-price span { font-size: 16px; color: var(--text-muted); font-weight: normal; font-family: 'Tajawal'; }

.features-list { width: 100%; background: rgba(0,0,0,0.3); padding: 25px; border-radius: 20px; margin-bottom: 40px; }
.features-list ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 15px; }
.features-list li { font-size: 16px; display: flex; align-items: center; gap: 12px; }
.features-list li::before { content: '✨'; color: var(--gold-primary); }

/* زر Payhip */
.btn-payhip { width: 100%; padding: 20px; background: linear-gradient(135deg, var(--violet-neon), #5B21B6); color: #fff; border: none; border-radius: 16px; font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.3s; box-shadow: 0 15px 40px rgba(124, 58, 237, 0.4); text-align: center; display: block; }
.btn-payhip:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 20px 50px rgba(124, 58, 237, 0.6); }
.btn-back { margin-top: 25px; color: var(--text-muted); font-size: 15px; transition: 0.3s; }
.btn-back:hover { color: #fff; }

@media(max-width: 600px) { .checkout-pedestal { padding: 40px 25px; } .plan-title { font-size: 26px; } .plan-price { font-size: 38px; } }
</style>
<script type="text/javascript" src="https://payhip.com/payhip.js"></script>
</head>
<body>

<div class="bg-glow"></div>

<div class="checkout-pedestal">
  <div class="plan-icon" id="display-icon">💎</div>
  <h1 class="plan-title" id="display-name">جاري التحميل...</h1>
  <div class="plan-price" id="display-price">$0 <span>/ شهرياً</span></div>
  
  <div class="features-list">
    <ul id="display-features">
      <li>جاري جلب تفاصيل الباقة...</li>
    </ul>
  </div>

  <a href="#" id="payhip-btn" class="payhip-buy-button btn-payhip" data-theme="none">إتمام الدفع الآمن 🔒</a>
  <a href="packages.html" class="btn-back">← تغيير الباقة</a>
</div>

<script>
  // 1. قاعدة بيانات الباقات مع روابط Payhip التي أرسلتها
  const plansData = {
    'basic_gen': { name: 'الأساسية (توليد)', price: '30', icon: '⚡', link: 'https://payhip.com/b/f3IeO', features: ['رصيد 5 دقائق مقسمة', 'دقة 1080p عالية', 'علامة مائية مصغرة', 'أسئلة تفاعلية'] },
    'pro_gen': { name: 'برو (توليد)', price: '80', icon: '🔥', link: 'https://payhip.com/b/TrXUa', features: ['رصيد 20 دقيقة مقسمة', 'دقة 4K سينمائية', 'بدون أي علامة مائية', 'توليد أسرع + حقوق تجارية'] },
    'max_gen': { name: 'برو ماكس (توليد)', price: '320', icon: '👑', link: 'https://payhip.com/b/TrXUa', /* تأكد من تغيير هذا الرابط لاحقاً */ features: ['رصيد 50 دقيقة مقسمة', 'أقصى جودة وعدسات متقدمة', 'بدون علامة مائية', 'مخصص للشركات'] },
    
    'creator_auto': { name: 'صانع المحتوى (مونتاج)', price: '50', icon: '🎬', link: 'https://payhip.com/b/npTrv', features: ['رصيد 100 دقيقة شهرياً', '10 فيديوهات (حد أقصى 10د)', 'صوت فصيح + ترجمة', 'مقاطع B-Roll عالية الجودة'] },
    'pro_auto': { name: 'القناة الاحترافية (مونتاج)', price: '100', icon: '🚀', link: 'https://payhip.com/b/LuAf7', features: ['رصيد 750 دقيقة شهرياً', '30 فيديو (حد أقصى 25د)', 'بدون علامات مائية', 'رندر سريع وأصوات مميزة'] },
    'max_auto': { name: 'بورماكس الوثائقي', price: '300', icon: '🎥', link: 'https://payhip.com/b/h1lwQ', features: ['رصيد 2000 دقيقة شهرياً', '40 فيديو (حد أقصى 60د)', 'أولوية قصوى في السيرفرات', 'مثالي للوثائقيات الطويلة'] }
  };

  // 2. قراءة الرابط وجلب البيانات
  const urlParams = new URLSearchParams(window.location.search);
  const currentPlanId = urlParams.get('plan');
  const plan = plansData[currentPlanId];

  if (plan) {
    document.getElementById('display-name').innerText = plan.name;
    document.getElementById('display-price').innerHTML = `$${plan.price} <span>/ شهرياً</span>`;
    document.getElementById('display-icon').innerText = plan.icon;
    document.getElementById('payhip-btn').href = plan.link;
    
    const featuresHtml = plan.features.map(f => `<li>${f}</li>`).join('');
    document.getElementById('display-features').innerHTML = featuresHtml;

    // خطوة ذكية: حفظ الباقة المطلوبة مؤقتاً في المتصفح لكي نعرفها عندما نعود بعد الدفع
    localStorage.setItem('pending_plan', currentPlanId);
  } else {
    window.location.href = "packages.html"; // طرد المستخدم إذا تلاعب بالرابط
  }
</script>

</body>
</html>
