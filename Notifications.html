<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GoodVidify — الإشعارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #090a0f;
  --bg-card: rgba(18, 20, 29, 0.6);
  --gold-primary: #FFB800;
  --gold-light: #FFD700;
  --violet-neon: #7C3AED;
  --violet-light: #9D4EDD;
  --text-main: #ffffff;
  --text-muted: #a1a1aa;
  --border-glass: rgba(255, 255, 255, 0.08);
  --gradient-gold: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
  --gradient-violet: linear-gradient(135deg, var(--violet-light), var(--violet-neon));
}
* { box-sizing: border-box; }
body { margin: 0; display: flex; background-color: var(--bg-dark); color: var(--text-main); font-family: 'Tajawal', sans-serif; height: 100vh; overflow: hidden; }
a { text-decoration: none; color: inherit; }

/* === الخلفية والتأثيرات === */
.bg-effects { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.grid-bg { position: absolute; inset: 0; opacity: 0.1; background-image: linear-gradient(rgba(255,255,255,.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.1) 1px, transparent 1px); background-size: 40px 40px; mask-image: radial-gradient(ellipse at center, #000, transparent 80%); }

/* === الشريط الجانبي === */
aside { width: 260px; background: rgba(12, 14, 20, 0.8); border-inline-end: 1px solid var(--border-glass); display: flex; flex-direction: column; padding: 24px; backdrop-filter: blur(20px); z-index: 10; }
.brand { font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 900; margin-bottom: 40px; text-align: center; }
.brand b { background: var(--gradient-gold); -webkit-background-clip: text; background-clip: text; color: transparent; }

.nav-menu { display: flex; flex-direction: column; gap: 12px; flex-grow: 1; }
.nav-btn { padding: 14px 20px; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--text-muted); text-align: start; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 12px; font-family: inherit; }
.nav-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
.nav-btn.active { background: rgba(124, 58, 237, 0.1); border-color: rgba(124, 58, 237, 0.3); color: var(--violet-light); box-shadow: inset 0 0 20px rgba(124, 58, 237, 0.05); }

.user-info { padding-top: 20px; border-top: 1px solid var(--border-glass); text-align: center; font-size: 13px; color: var(--text-muted); }
.btn-logout { width: 100%; padding: 10px; margin-top: 10px; border-radius: 8px; background: rgba(255, 95, 86, 0.1); color: #ff5f56; border: 1px solid rgba(255, 95, 86, 0.2); cursor: pointer; font-weight: 700; transition: 0.3s; font-family: inherit; }
.btn-logout:hover { background: rgba(255, 95, 86, 0.2); }

/* === منطقة المحتوى والإشعارات === */
main { flex-grow: 1; padding: 40px; overflow-y: auto; }
.page-header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--border-glass); padding-bottom: 20px; }
.page-header h2 { margin: 0 0 10px; font-size: 28px; }
.page-header p { margin: 0; color: var(--text-muted); }

.btn-clear { background: transparent; border: 1px solid var(--border-glass); color: var(--text-muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-family: inherit; font-size: 13px; }
.btn-clear:hover { background: rgba(255, 95, 86, 0.1); color: #ff5f56; border-color: rgba(255, 95, 86, 0.2); }

.notifications-list { display: flex; flex-direction: column; gap: 16px; max-width: 900px; }

/* بطاقة الإشعار */
.notif-card { display: flex; gap: 16px; background: var(--bg-card); padding: 20px; border-radius: 16px; border: 1px solid var(--border-glass); align-items: flex-start; transition: 0.3s; backdrop-filter: blur(10px); }
.notif-card:hover { background: rgba(255,255,255,0.05); transform: translateY(-2px); }
.notif-card.unread { border-inline-start: 4px solid var(--gold-primary); background: rgba(124, 58, 237, 0.05); }

.notif-icon { width: 50px; height: 50px; min-width: 50px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; }
.icon-success { background: rgba(37, 211, 102, 0.1); color: #25D366; }
.icon-info { background: rgba(124, 58, 237, 0.1); color: var(--violet-light); }
.icon-warning { background: rgba(255, 184, 0, 0.1); color: var(--gold-primary); }

.notif-body { flex-grow: 1; }
.notif-title { font-size: 16px; font-weight: 700; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
.notif-time { font-size: 12px; color: var(--text-muted); font-weight: normal; }
.notif-text { color: var(--text-muted); font-size: 14px; margin: 0; line-height: 1.6; }

.badge-new { background: var(--gradient-gold); color: #000; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 900; margin-inline-start: 10px; }
.empty-state { text-align: center; color: var(--text-muted); padding: 40px; font-size: 16px; }
</style>
</head>
<body>

<div class="bg-effects"><div class="grid-bg"></div></div>

<!-- الشريط الجانبي -->
<aside>
  <div class="brand">Good<b>Vidify</b></div>
  
  <div class="nav-menu">
    <a href="home.html" class="nav-btn">🏠 الرئيسية</a>
    <a href="use.html" class="nav-btn">📊 الاستخدام</a>
    <a href="inquiries.html" class="nav-btn">💬 الاستفسارات</a>
    
    <a href="Notifications.html" class="nav-btn active">🔔 الإشعارات</a>
    <a href="packages.html" class="nav-btn">💳 الباقات والشراء</a>
  </div>

  <div class="user-info">
    <div id="user-email">جاري التحميل...</div>
    <button class="btn-logout" id="btn-logout">تسجيل الخروج</button>
  </div>
</aside>

<!-- منطقة المحتوى -->
<main>
  <div class="page-header">
    <div>
      <h2>الإشعارات</h2>
      <p>تابع حالة فيديوهاتك، تحديثات النظام، وتنبيهات الباقة.</p>
    </div>
    <button class="btn-clear" onclick="markAllAsRead()">تحديد الكل كمقروء ✔️</button>
  </div>

  <!-- الحاوية التي سيتم عرض الإشعارات بداخلها من Firebase -->
  <div class="notifications-list" id="notif-list">
    <div class="empty-state">جاري تحميل الإشعارات...</div>
  </div>
</main>

<!-- ربط Firebase Auth و Realtime Database -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyConJRhjncwJ3f6oQvH7Ap7mpa6m9NH4oQ",
    authDomain: "scroli.firebaseapp.com",
    databaseURL: "https://scroli-default-rtdb.firebaseio.com",
    projectId: "scroli",
    storageBucket: "scroli.firebasestorage.app",
    messagingSenderId: "839815358569",
    appId: "1:839815358569:web:f62062770c11c7eb2ddaf8"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  
  const notifList = document.getElementById('notif-list');
  let currentUid = null;
  let unreadKeys = []; // لتخزين معرفات الإشعارات غير المقروءة لاستخدامها عند النقر على "مقروء"

  // التحقق من المستخدم وتفعيل مستمع الإشعارات
  onAuthStateChanged(auth, (user) => {
    if (user) { 
      document.getElementById('user-email').innerText = user.email; 
      currentUid = user.uid;
      fetchNotifications(user.uid);
    } else { 
      window.location.href = "login.html"; 
    }
  });

  // جلب الإشعارات وعرضها (تعمل Realtime)
  function fetchNotifications(uid) {
    const notifRef = ref(db, 'users/' + uid + '/notifications');
    onValue(notifRef, (snapshot) => {
      notifList.innerHTML = '';
      unreadKeys = [];
      
      if (snapshot.exists()) {
        const data = snapshot.val();
        // تحويل الكائن إلى مصفوفة لترتيبها من الأحدث للأقدم
        const notifsArray = Object.keys(data).map(key => {
          return { id: key, ...data[key] };
        }).reverse();

        notifsArray.forEach(notif => {
          if (!notif.isRead) unreadKeys.push(notif.id);

          let iconClass = 'icon-info';
          let iconEmoji = '👋';
          
          if (notif.type === 'success') { iconClass = 'icon-success'; iconEmoji = '🎬'; }
          if (notif.type === 'warning') { iconClass = 'icon-warning'; iconEmoji = '⏳'; }

          let unreadClass = notif.isRead ? '' : 'unread';
          let badgeHtml = notif.isRead ? '' : '<span class="badge-new">جديد</span>';

          const card = document.createElement('div');
          card.className = `notif-card ${unreadClass}`;
          card.innerHTML = `
            <div class="notif-icon ${iconClass}">${iconEmoji}</div>
            <div class="notif-body">
              <h3 class="notif-title">
                <span>${notif.title} ${badgeHtml}</span>
                <span class="notif-time">${notif.time || ''}</span>
              </h3>
              <p class="notif-text">${notif.text}</p>
            </div>
          `;
          notifList.appendChild(card);
        });
      } else {
        notifList.innerHTML = '<div class="empty-state">لا توجد إشعارات حالياً.</div>';
      }
    });
  }

  // جعل دالة تحديث الحالة (مقروء) متاحة للنافذة
  window.markAllAsRead = async function() {
    if (!currentUid || unreadKeys.length === 0) return;
    
    const updates = {};
    unreadKeys.forEach(key => {
      updates[`users/${currentUid}/notifications/${key}/isRead`] = true;
    });

    try {
      await update(ref(db), updates);
      // الدالة fetchNotifications ستعمل تلقائياً بسبب onValue وتزيل التصميم "غير مقروء"
    } catch (error) {
      console.error("حدث خطأ أثناء تحديث الإشعارات", error);
    }
  };

  // تسجيل الخروج
  document.getElementById('btn-logout').addEventListener('click', () => {
    signOut(auth).then(() => { window.location.href = "login.html"; });
  });
</script>

</body>
</html>
