<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>إدارة GoodVidify — إرسال الإشعارات</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #090a0f; --bg-card: rgba(18, 20, 29, 0.8);
  --gold-primary: #FFB800; --violet-light: #9D4EDD;
  --text-main: #ffffff; --text-muted: #a1a1aa;
  --border-glass: rgba(255, 255, 255, 0.08);
}
body { margin: 0; background-color: var(--bg-dark); color: var(--text-main); font-family: 'Tajawal', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.admin-container { width: 100%; max-width: 600px; padding: 40px; background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
.header { text-align: center; margin-bottom: 30px; }
.header h2 { margin: 0; color: #ff5f56; font-size: 24px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 8px; color: var(--gold-primary); font-weight: 700; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-glass); border-radius: 12px; color: #fff; font-family: inherit; }
.form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--gold-primary); }
.btn-send { width: 100%; padding: 16px; background: #ff5f56; color: #fff; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; }
.btn-send:hover { background: #e04840; }
#status-msg { margin-top: 15px; text-align: center; font-size: 14px; font-weight: bold; }
</style>
</head>
<body>

<div class="admin-container">
  <div class="header">
    <h2>لوحة الإدارة 🛡️</h2>
    <p style="color: var(--text-muted);">إرسال إشعار فوري لمستخدم</p>
  </div>

  <div class="form-group">
    <label>معرف المستخدم (UID)</label>
    <input type="text" id="target-uid" placeholder="الصق UID الخاص بالزبون هنا">
  </div>
  
  <div class="form-group">
    <label>نوع الإشعار</label>
    <select id="notif-type">
      <option value="info">معلومة عادية (بنفسجي)</option>
      <option value="success">نجاح العمل (أخضر)</option>
      <option value="warning">تنبيه / تحذير (ذهبي)</option>
    </select>
  </div>

  <div class="form-group">
    <label>عنوان الإشعار</label>
    <input type="text" id="notif-title" placeholder="مثال: تم تفعيل الباقة بنجاح">
  </div>

  <div class="form-group">
    <label>نص الإشعار</label>
    <textarea id="notif-body" rows="4" placeholder="اكتب تفاصيل الإشعار هنا..."></textarea>
  </div>

  <button class="btn-send" id="btn-send">إرسال الإشعار الآن 🚀</button>
  <div id="status-msg"></div>
</div>

<!-- Firebase Realtime Database Logic -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyConJRhjncwJ3f6oQvH7Ap7mpa6m9NH4oQ",
    authDomain: "scroli.firebaseapp.com",
    databaseURL: "https://scroli-default-rtdb.firebaseio.com",
    projectId: "scroli",
    storageBucket: "scroli.firebasestorage.app",
    messagingSenderId: "839815358569",
    appId: "1:839815358569:web:f62062770c11c7eb2ddaf8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  document.getElementById('btn-send').addEventListener('click', () => {
    const uid = document.getElementById('target-uid').value;
    const type = document.getElementById('notif-type').value;
    const title = document.getElementById('notif-title').value;
    const body = document.getElementById('notif-body').value;
    const statusMsg = document.getElementById('status-msg');

    if(!uid || !title || !body) {
      statusMsg.style.color = 'red';
      statusMsg.innerText = "يرجى تعبئة جميع الحقول!";
      return;
    }

    // إرسال الإشعار لقاعدة البيانات
    const notifRef = ref(db, 'users/' + uid + '/notifications');
    const newNotif = push(notifRef);

    set(newNotif, {
      title: title,
      text: body,
      type: type,
      time: new Date().toLocaleDateString('ar-EG', { hour: 'numeric', minute: 'numeric' }),
      isRead: false
    }).then(() => {
      statusMsg.style.color = '#25D366';
      statusMsg.innerText = "تم إرسال الإشعار بنجاح!";
      document.getElementById('notif-title').value = '';
      document.getElementById('notif-body').value = '';
    }).catch((error) => {
      statusMsg.style.color = 'red';
      statusMsg.innerText = "حدث خطأ: " + error.message;
    });
  });
</script>
</body>
</html>
